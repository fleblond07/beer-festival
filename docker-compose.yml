services:
  postgres:
    image: postgres:17-alpine
    container_name: beer-festival-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-beer_festival}
      - POSTGRES_USER=${POSTGRES_USER:-beer_festival}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beer_festival}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - beer-festival

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beer-festival-backend
    ports:
      - "1337:1337"
    environment:
      - PORT=1337
      - ALLOWED_ORIGINS=*
      - DATABASE_URL=postgres://${POSTGRES_USER:-beer_festival}:${POSTGRES_PASSWORD:-beer_festival}@postgres:5432/${POSTGRES_DB:-beer_festival}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:1337/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - beer-festival

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beer-festival-frontend
    ports:
      - "1338:1338"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - beer-festival

volumes:
  postgres-data:

networks:
  beer-festival:
    driver: bridge
